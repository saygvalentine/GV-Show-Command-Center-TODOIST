kind = "web"
previewPath = "/"
title = "Show Command Center"
version = "1.0.0"
id = "artifacts/show-command-center"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21672

[services.development]
run = "pnpm --filter @workspace/show-command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/show-command-center", "run", "build" ]
publicDir = "artifacts/show-command-center/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21672"
BASE_PATH = "/"
